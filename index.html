<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Torchbearer Community</title>
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="https://www.torchbearer.community/" />
    <!-- This site exists only to send the bare domain to www. GitHub Pages
         holds the HTTPS certificate for torchbearer.community; the real site
         lives on Cloudflare Pages at www. The script keeps the path, query and
         fragment; the meta refresh is the no-JS fallback. -->
    <script>
      location.replace('https://www.torchbearer.community' + location.pathname + location.search + location.hash);
    </script>
    <meta http-equiv="refresh" content="0; url=https://www.torchbearer.community/" />
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #1a1410; color: #fff; }
      a { color: #c97857; }
    </style>
  </head>
  <body>
    <p>Redirecting to <a href="https://www.torchbearer.community/">www.torchbearer.community</a>…</p>
  </body>
</html>
